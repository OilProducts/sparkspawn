        N=$((N + 1))
        printf '%s\n' "$N" > .mathlab/guard-guard_verify
        if [ "$N" -ge 3 ]; then
          echo "REPAIR BUDGET EXHAUSTED: guard_verify attempt $N of 3; ending this cycle and recording the obstruction."
