- from: guard_explore_synth
  to: synthesize_explore
  condition: outcome=success
- from: guard_explore_synth
  to: record_obstruction
  condition: outcome=fail
- from: review_explore
  to: commit_cycle
  condition: outcome=success
# The weighted fan_out -> join edge does double duty: inside the parallel
# handler it is a trivially-succeeding branch, and after the fan-out
# completes the main traversal prefers it by weight, so neither real
# branch is re-executed sequentially. It stays unconditional because a
# wait_all fan-out reports partial_success when a branch fails and the
# arbiter must still convene to judge what survived.
- from: fan_out
  to: join
  weight: 1
- from: fan_out
  to: prove
- from: fan_out
  to: refute
- from: prove
  to: prover_gate
  condition: outcome=success
- from: prover_gate
  to: guard_prover
  label: Fix Proof
  condition: outcome=fail
- from: guard_prover
  to: prove
  condition: outcome=success
- from: guard_prover
  to: join
  condition: outcome=fail
- from: prover_gate
  to: join
  condition: outcome=success
- from: refute
  to: refuter_gate
  condition: outcome=success
- from: refuter_gate
  to: guard_refuter
  label: Fix Evidence
  condition: outcome=fail
- from: guard_refuter
  to: refute
  condition: outcome=success
- from: guard_refuter
  to: join
  condition: outcome=fail
- from: refuter_gate
  to: join
  condition: outcome=success
- from: join
  to: arbiter
  condition: outcome=success
- from: arbiter
  to: repair_statement
  label: Repair
  condition: outcome=success && preferred_label=Repair
- from: arbiter
  to: round_gate
  label: Continue
  condition: outcome=success && preferred_label=Continue
- from: arbiter
  to: synthesize_attack
  label: Findings
