edges:
- from: start
  to: prepare_workspace
- from: prepare_workspace
  to: orient
  condition: outcome=success
- from: orient
  to: fan_out
  label: Attack
  condition: outcome=success && preferred_label=Attack
- from: orient
  to: formalize
